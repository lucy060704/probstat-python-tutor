  - {source_node_id: ps_independence, target_node_id: cd_discrete, relation: prerequisite, rationale_zh: 概率规则支持离散分布建模。}
  - {source_node_id: cd_discrete, target_node_id: cd_parameters_support, relation: supports, rationale_zh: 离散模型的参数决定成功次数等支持集和数字特征。}
  - {source_node_id: cd_continuous, target_node_id: cd_parameters_support, relation: supports, rationale_zh: 连续模型的参数与形式共同决定支持集和密度尺度。}
  - {source_node_id: cd_parameters_support, target_node_id: cd_python_representation, relation: supports, rationale_zh: 明确参数和支持集后才能选择 PMF、PDF 或 CDF API。}
  - {source_node_id: cd_parameters_support, target_node_id: jc_joint_conditionals, relation: prerequisite, rationale_zh: 联合模型仍需明确变量支持集。}
  - {source_node_id: jc_joint_conditionals, target_node_id: jc_covariance, relation: prerequisite, rationale_zh: 联合分布和边缘期望决定 E(XY)、E(X) 与 E(Y)，是协方差计算基础。}
  - {source_node_id: jc_covariance, target_node_id: jc_correlation_causation, relation: prerequisite, rationale_zh: 相关系数通过标准差对协方差标准化，之后才能讨论解释边界。}
  - {source_node_id: jc_joint_conditionals, target_node_id: jc_grouping, relation: supports, rationale_zh: 分组汇总是在样本中观察条件分布与条件统计量的一种方式。}
  - {source_node_id: jc_grouping, target_node_id: jc_correlation_causation, relation: supports, rationale_zh: 分组构成和有效分母有助于识别相关解释中的混杂与聚合风险。}
  - {source_node_id: ds_spread, target_node_id: jc_covariance, relation: prerequisite, rationale_zh: 理解方差、标准差和量纲后才能区分协方差与相关系数。}
  - {source_node_id: ds_spread, target_node_id: si_standard_error, relation: prerequisite, rationale_zh: 区分样本波动后才能理解标准误。}
  - {source_node_id: ds_outlier_robustness, target_node_id: si_clt, relation: supports, rationale_zh: 偏度、重尾和极端值会影响有限样本下的正态近似质量。}
  - {source_node_id: ps_independence, target_node_id: si_sampling_distribution, relation: prerequisite, rationale_zh: 简单抽样分布与标准误公式需要明确观测之间的独立或依赖结构。}
  - {source_node_id: ps_monte_carlo_error, target_node_id: si_sampling_distribution, relation: supports, rationale_zh: 重复模拟帮助形成抽样分布直觉。}
  - {source_node_id: si_population_sample, target_node_id: si_sampling_distribution, relation: prerequisite, rationale_zh: 先区分总体、样本和统计量，才能定义统计量在重复抽样下的分布。}
  - {source_node_id: si_sampling_distribution, target_node_id: si_clt, relation: prerequisite, rationale_zh: 中心极限定理描述统计量的抽样分布。}
  - {source_node_id: si_sampling_distribution, target_node_id: si_standard_error, relation: prerequisite, rationale_zh: 标准误是目标统计量抽样分布的标准差或其估计。}
  - {source_node_id: si_clt, target_node_id: si_standard_error, relation: supports, rationale_zh: 中心极限定理使用标准误标准化样本均值，并为近似推断提供分布基础。}
  - {source_node_id: si_population_sample, target_node_id: ec_point_estimation, relation: prerequisite, rationale_zh: 先区分总体参数和样本统计量，才能定义估计量及其一次估计值。}
  - {source_node_id: ec_point_estimation, target_node_id: ec_bias_variability, relation: prerequisite, rationale_zh: 明确估计量和目标参数后，才能在重复抽样下评价偏差与方差。}
  - {source_node_id: ec_point_estimation, target_node_id: ec_interval_construction, relation: prerequisite, rationale_zh: 置信区间围绕一次样本得到的点估计展开。}
  - {source_node_id: ec_bias_variability, target_node_id: ec_interval_construction, relation: supports, rationale_zh: 估计量的随机波动和偏差边界决定区间尺度与适用限制。}
  - {source_node_id: si_standard_error, target_node_id: ec_interval_construction, relation: prerequisite, rationale_zh: 标准误决定区间的随机波动尺度。}
  - {source_node_id: ec_interval_construction, target_node_id: ec_interval_interpretation, relation: supports, rationale_zh: 构造过程决定区间的正确解释。}
  - {source_node_id: ec_bias_variability, target_node_id: ec_interval_interpretation, relation: supports, rationale_zh: 区间较窄只表示随机精度，系统偏差仍会破坏围绕真参数的实际覆盖。}
  - {source_node_id: jc_correlation_causation, target_node_id: ht_ab_design, relation: supports, rationale_zh: 因果限制促使 A/B 分析重视随机设计。}
  - {source_node_id: ec_interval_interpretation, target_node_id: ht_p_value, relation: supports, rationale_zh: 区间和检验共享抽样推断基础。}
  - {source_node_id: ht_hypotheses, target_node_id: ht_p_value, relation: prerequisite, rationale_zh: p 值必须在明确的原假设下解释。}
  - {source_node_id: ht_p_value, target_node_id: ht_errors_power, relation: prerequisite, rationale_zh: 先理解检验决策，才能区分两类错误与功效。}
  - {source_node_id: ht_hypotheses, target_node_id: ht_ab_design, relation: prerequisite, rationale_zh: A/B 设计必须在看结果前定义参数对象和检验方向。}
  - {source_node_id: ht_p_value, target_node_id: ht_ab_design, relation: supports, rationale_zh: A/B 决策需要把 p 值与效应量、区间和实际阈值一起解释。}
  - {source_node_id: ht_errors_power, target_node_id: ht_ab_design, relation: supports, rationale_zh: 错误率、功效和最小关心效应共同约束实验设计。}
  - {source_node_id: jc_grouping, target_node_id: ht_ab_design, relation: supports, rationale_zh: 受审的分组与分母汇总为 A/B 效应比较提供数据基础。}
  - {source_node_id: dq_decision_log, target_node_id: ht_ab_design, relation: supports, rationale_zh: 分配、排除、缺失、流失和停止规则必须留下可复核记录。}

