  - {source_node_id: ds_spread, target_node_id: ds_context_interpretation, relation: supports, rationale_zh: 离散程度为情境中的稳定性和波动解释提供证据。}
  - {source_node_id: ds_outlier_robustness, target_node_id: ds_context_interpretation, relation: supports, rationale_zh: 异常值风险决定描述性结论需要限定的适用边界。}
