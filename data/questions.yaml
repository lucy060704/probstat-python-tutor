    prerequisites: [sampling_standard_error]
    difficulty: 0.65
    question_type: python
    prompt: >-
      系统已提供 `mean=50`、`standard_error=2` 和 `critical_value=1.96`。
      答案栏填写按“点估计 ± 临界值 × 标准误”得到的有序区间端点；Python 代码栏使用
      `np.array` 构造下限和上限，必须引用系统变量，不能硬编码最终端点。代码只做 AST 静态检查，绝不执行。
    dataset:
      mean: 50
      standard_error: 2
      critical_value: 1.96
    expected_answer: [46.08, 53.92]
    numeric_tolerance: 0.000001
    rubric:
      - 正确计算误差界限 1.96 × 2 = 3.92
      - 得到下限 46.08 和上限 53.92
      - Python 最终结果连接点估计、临界值、标准误和有序双侧端点
      - 不把 1.96 说成脱离条件的通用常数
    misconception_tags:
      - adds_margin_both_sides
      - reversed_interval_endpoints
      - omits_critical_value
      - uses_standard_deviation_as_ci_scale
      - hardcoded_result_not_implementation
    dimension_weights:
      concept: 0.10
      calculation: 0.30
      python: 0.60
      interpretation: 0.00
    evidence_policy:
      reasoning_required: false
      reasoning_support_any: [误差界限, "3.92", 两侧加减, 下限, 上限]
      relevance_terms: [mean, standard_error, "1.96", 置信区间, 端点]
      text_rules:
        - rule_id: critical_value_claimed_universal
          source: reasoning
          dimension: concept
          verdict: contradicts
          phrases: [任何样本量、任何分布都固定使用 1.96, 不需要检查构造区间的条件]
          negation_guards: [不能, 不是]
          message_zh: 临界值 1.96 不能脱离置信水平和适用条件无条件使用。
          misconception_tag: critical_value_claimed_universal
        - rule_id: parameter_has_95_percent_probability
          source: reasoning
          dimension: interpretation
          verdict: contradicts
          phrases: [真实均值有 95% 的概率, 参数有 95% 的概率, 参数仍然有 95% 概率]
          negation_guards: [不能说, 不表示, 不是]
          message_zh: 端点计算正确也不能把固定参数解释为以 95% 概率落在本次区间中。
          misconception_tag: parameter_has_95_percent_probability
      python_static_spec:
        structure_kind: confidence_interval_formula
        variants:
          - required_calls: [np.array]
            required_names: [mean, standard_error]
            required_operators: [Add, Mult]
            allowed_root_kinds: [BinOp, Call]
            allowed_operators: [Add, Sub, Mult, USub]
        mismatch_rules:
          - rule_id: adds_confidence_margin_both_sides
            kind: adds_confidence_margin_both_sides
            message_zh: 两个端点都加上误差界限会丢失下限；偏移顺序应先负后正。
            misconception_tag: adds_margin_both_sides
          - rule_id: reverses_confidence_interval_endpoints
            kind: reversed_confidence_interval_endpoints
            message_zh: 端点顺序被反转；答案要求先给下限、再给上限。
            misconception_tag: reversed_interval_endpoints
          - rule_id: omits_confidence_critical_value
            kind: omits_confidence_critical_value
            message_zh: 区间只加减了一个标准误，没有乘题设临界值。
            misconception_tag: omits_critical_value
          - rule_id: uses_standard_deviation_as_ci_scale
            kind: uses_standard_deviation_as_ci_scale
            message_zh: 均值区间的尺度应使用题设标准误，不能把原始观测标准差直接代入。
            misconception_tag: uses_standard_deviation_as_ci_scale
        mismatch_rule_id: hardcoded_result_not_implementation
        mismatch_message_zh: 静态代码没有体现均值、标准误、临界值和双侧区间运算，不能只硬编码端点。
        misconception_tag: hardcoded_result_not_implementation
    hints:
      concept_cue: 概念提示：区间中心、误差界限和原始观测的离散程度分别由什么量表示？
      method_cue: 方法提示：先计算“临界值 × 标准误”，再从点估计向相反的两个方向移动。
      partial_step: 步骤提示：误差界限为 1.96×2；下限用均值减去它，上限用均值加上它，代码最终要连接这些变量。
      complete_explanation:
        concept: 双侧区间由点估计居中，以临界值乘标准误作为误差界限；标准误不是原始数据标准差。
        calculation: 误差界限为 3.92，因此有序端点为 [46.08, 53.92]。
        python: 可写 mean + np.array([-1, 1]) * critical_value * standard_error；系统只检查 AST 和结果依赖，不执行代码。
        interpretation: 端点计算成立仍依赖所选区间方法的抽样、分布和标准误条件，1.96 不是所有问题的通用常数。
