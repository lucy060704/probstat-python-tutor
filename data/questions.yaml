  - id: variance_std_python_01
    title: 理解 Pandas 样本标准差
    unit_id: descriptive_statistics
    concept_id: variance_std
    knowledge_node_ids: [ds_spread]
    prerequisites: [mean_median]
    difficulty: 0.45
    question_type: python
    prompt: 数据已存在 Series `s` 中。按样本标准差（ddof=1）回答数值，并在代码栏写出一行 Pandas 或 NumPy 计算表达式。
    dataset:
      series: [2, 4, 6]
      ddof: 1
    expected_answer: 2.0
    numeric_tolerance: 0.000000001
    rubric:
      - 使用样本标准差口径
      - 得到数值 2.0
    misconception_tags: [uses_population_ddof, returns_variance]
    dimension_weights:
      concept: 0.20
      calculation: 0.25
      python: 0.55
      interpretation: 0.00
    evidence_policy:
      reasoning_required: false
      reasoning_support_any: [ddof=1, ddof, 样本标准差, n-1]
      relevance_terms: [std, var, 标准差, 方差, ddof]
      text_rules:
        - rule_id: ddof_claimed_irrelevant
          source: reasoning
          dimension: concept
          verdict: contradicts
          phrases: [分母用 3 或 2 都会得到 2, 不需要说明 ddof, ddof 不重要]
          negation_guards: [不是, 不能]
          message_zh: 总体与样本标准差的分母不同，ddof 会影响结果。
          misconception_tag: ddof_claimed_irrelevant
        - rule_id: larger_std_more_stable
          source: reasoning
          dimension: interpretation
          verdict: contradicts
          phrases: [标准差越大表示数据越集中, 标准差越大表示数据越稳定]
          negation_guards: [不是, 不表示]
          message_zh: 标准差越大通常表示数据更分散，而不是更集中稳定。
          misconception_tag: larger_std_more_stable
      python_static_spec:
        structure_kind: direct_std_call
        variants:
          - required_calls: [s.std]
            allowed_root_kinds: [Call]
            allowed_operators: []
          - required_calls: [np.std]
            allowed_root_kinds: [Call]
            allowed_operators: []
            required_keywords: [ddof=1]
        mismatch_rules:
          - rule_id: variance_returned_as_standard_deviation
            kind: direct_var_call
            message_zh: 结果表达式调用了 var，得到的是方差，不是题目要求的标准差。
            misconception_tag: returns_variance
          - rule_id: numpy_population_std_default
            kind: numpy_std_missing_ddof
            message_zh: NumPy 的 std 调用没有设置 ddof=1，使用了总体标准差默认口径。
            misconception_tag: uses_population_ddof
        mismatch_rule_id: std_python_structure_mismatch
        mismatch_message_zh: 静态代码中没有观察到符合样本标准差口径的 std 调用。
        misconception_tag: python_code_conflicts_with_answer
    hints:
      concept_cue: 概念提示：std 返回的是平方离差的结果，还是对方差开平方后的结果？
      method_cue: 方法提示：先求均值和平方离差和，按题目给定的自由度口径确定分母，最后开平方。
      partial_step: 步骤提示：均值为 4，平方离差为 [4, 0, 4]，总和为 8；ddof=1 时分母为 3-1，样本方差为 4。
      complete_explanation:
        concept: 样本标准差是样本方差的平方根；Pandas Series.std() 默认使用 ddof=1。
        calculation: 样本方差为 8/(3-1)=4，样本标准差为 √4=2。
        python: 代码栏可写 s.std()；等价 NumPy 写法是 np.std(s, ddof=1)。系统只检查 AST，不执行代码。
        interpretation: 标准差 2 与原数据使用相同单位，它描述样本内波动，不表示每个观测都恰好偏离均值 2。
    python_code_required: true
    review_status: pending_teacher_review
    version: 0.1.0

