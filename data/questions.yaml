  - id: sampling_inference_clt_01
    title: 区分抽样分布与中心极限定理的对象
    unit_id: sampling_inference
    concept_id: sampling_standard_error
    knowledge_node_ids: [si_population_sample, si_sampling_distribution, si_clt, si_standard_error]
    prerequisites: [probability_simulation, common_distributions, variance_std]
    difficulty: 0.68
    question_type: concept
    prompt: >-
      某目标总体明显右偏，总体均值 μ=50、总体标准差 σ=16。每次按相同方式独立随机抽取
      n=64 个观测并计算一个样本均值，共重复 2000 次。哪项说法正确？请选择一项，并区分
      总体、单份样本、样本均值统计量和抽样分布，说明中心极限定理的对象、条件和标准误。
      A. 2000 个样本均值形成样本均值抽样分布的经验近似；在独立随机抽样、总体方差有限且
      样本量足够时，其分布可近似正态，中心为 50、标准误为 2，但原始个体观测仍可右偏。
      B. 中心极限定理会把每份样本中的 64 个原始观测变成正态分布。
      C. 一份样本中 64 个观测的直方图就是样本均值的抽样分布。
      D. 样本均值标准误为 16/64=0.25，且 n=64 保证抽样分布精确正态。
    dataset:
      population_shape: right_skewed
      population_mean: 50
      population_standard_deviation: 16
      sample_size: 64
      repetitions: 2000
      sampling_design: independent_random_samples
      statistic: sample_mean
    expected_answer: A
    accepted_answers: [a, 选项A, 选项a]
    numeric_tolerance: null
    rubric:
      - 说明重复得到的样本均值形成抽样分布的经验近似
      - 说明中心极限定理近似的是样本均值的抽样分布并列出适用条件
      - 得出抽样分布中心为 50、标准误为 2
      - 不声称原始观测被正态化或近似必然精确
    misconception_tags: [raw_data_becomes_normal_under_clt, single_sample_is_sampling_distribution, se_divides_by_n, clt_exact_normality_claim]
    dimension_weights:
      concept: 0.55
      calculation: 0.20
      python: 0.00
      interpretation: 0.25
    evidence_policy:
      reasoning_required: true
      reasoning_support_groups:
        - [重复抽样, 反复抽样, 反复独立随机抽样, 每次只保留均值, 每次只保留一个均值, 许多样本均值, 做两千遍, 多次重复, 每回重新抽取]
        - [样本均值的抽样分布, 均值统计量的分布, 统计量的抽样分布, 平均数组成均值经验分布, 平均数组成均值的经验分布, 均值经验分布, 各批平均数的分布]
        - [独立随机, 随机且独立, 独立同分布, 相互独立, 观察互不依赖, 互不依赖]
        - [方差有限, 有限方差, 二阶矩存在]
