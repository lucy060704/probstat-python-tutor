          negation_guards: [不是, 并非, 不对, 错误]
          message_zh: 题设独立真 H0 下，全部不假阳性是 0.95^20，至少一次为 1-0.95^20≈0.6415。
          misconception_tag: familywise_error_calculation_wrong
        - rule_id: self_selection_treated_as_randomization
          source: reasoning
          dimension: interpretation
          verdict: contradicts
          phrases: [自选分组等价于随机化, 用户自己选所以两组可直接因果比较, 自愿用新界面也是随机实验, 让用户自主选择也能实现随机平衡, 让参与者自愿挑版本同样能消掉混杂]
          negation_guards: [不能说, 不是, 并非, 错误]
          message_zh: 自选使组间可能原本就不同，不是随机分配，不足以单独识别因果效应。
