          misconception_tag: sampling_distribution_confused_with_population
        - rule_id: se_divides_by_n_for_clt
          source: reasoning
          dimension: calculation
          verdict: contradicts
          phrases: [标准误是 16/64, 标准误为 0.25, 标准差直接除以 64, 标准误该写成16除以64, 16除以64也就是0.25]
          negation_guards: [不是, 不能, 并非]
          message_zh: 样本均值标准误的分母是样本量的平方根。
          misconception_tag: se_divides_by_n
        - rule_id: clt_exact_normality_claim
          source: reasoning
          dimension: interpretation
          verdict: contradicts
          phrases: [保证抽样分布精确正态, 必然精确正态, n=64 就一定正态, 样本量超过 30 就必然正态, 64这个数确保最后绝对就是正态, 64确保绝对正态, 样本数64保证正态]
          negation_guards: [不能, 不是, 不保证]
          message_zh: 一般总体下中心极限定理给出条件性的渐近近似，不是固定样本量下的精确保证。
          misconception_tag: clt_exact_normality_claim
        - rule_id: population_mean_changes_across_samples
