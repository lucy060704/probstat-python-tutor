schema_version: 2
questions:
  - id: data_quality_concept_01
    title: 区分缺失值与合法的零
    unit_id: data_quality
    concept_id: data_quality
    knowledge_node_ids: [dq_missing_values, dq_field_rules]
    prerequisites: []
    difficulty: 0.25
    question_type: concept
    prompt: >-
      score 的合法范围是 0–100，空白单元格加载为缺失。数据为
      [80, 缺失, 0, 100, 缺失, 70]。共有几个缺失值？答案栏只写数字，并说明 0 是否计入。
    dataset:
      column_name: score
      valid_range: [0, 100]
      values: [80, null, 0, 100, null, 70]
    expected_answer: 2
    numeric_tolerance: 0
    rubric:
      - 只把两个空白位置计为缺失
      - 根据字段规则说明 0 是已观察到的合法分数
      - 不在核验前擅自填补或删除记录
    misconception_tags: [zero_treated_as_missing, missing_replaced_without_context]
    dimension_weights:
      concept: 0.65
      calculation: 0.20
      python: 0.00
      interpretation: 0.15
    evidence_policy:
      reasoning_required: true
      reasoning_support_any: [0 是合法, 0是合法, 合法范围, 空白才是缺失, 两个空白, 第 2 和第 5]
      reasoning_insufficient_rule:
        rule_id: zero_validity_unexplained
        message_zh: 数量可能正确，但理由尚未说明为什么记录为 0 的位置不属于缺失。
        misconception_tag: zero_validity_unexplained
      relevance_terms: [缺失, 空白, "0", 合法范围, 两个]
      text_rules:
        - rule_id: valid_zero_counted_as_missing
          source: reasoning
          dimension: concept
          verdict: contradicts
          phrases: [0 也是缺失, 0也算缺失, 0 也算缺失, 零值就是缺失, 0 表示没有记录]
          negation_guards: [不能, 不是, 不应]
          message_zh: 题目已说明 0 位于合法范围且被实际记录，不能把它当作空白缺失。
          misconception_tag: zero_treated_as_missing
        - rule_id: missing_replaced_before_context_check
          source: reasoning
          dimension: interpretation
          verdict: contradicts
          phrases: [先把缺失都填成 0, 空白直接填 0, 缺失一律补零]
          negation_guards: [不能, 不是, 不应]
          message_zh: 缺失处理需要情境依据，不能在核验原因前一律填成 0。
          misconception_tag: missing_replaced_without_context
      python_static_spec: null
    hints:
      concept_cue: 概念提示：没有记录和明确记录为 0，是同一种数据状态吗？
      method_cue: 方法提示：按照题目给出的字段规则，只标记真正为空的单元格。
      partial_step: 步骤提示：第 2、5 个位置为空；第 3 个位置记录了一个位于合法范围内的数值。
      complete_explanation:
        concept: 缺失表示没有观察到值；0 是题设允许且已经观察到的成绩，两者不能混为一谈。
        calculation: 空白出现在第 2、5 个位置，所以缺失值数量为 2，分母仍要按分析目的说明。
        python: 可用 Series.isna() 生成缺失掩码，再用 sum() 计数；它不会把合法的 0 标为缺失。
        interpretation: 后续报告应注明两条缺失及处理规则，不能未经依据把空白补成 0。
    python_code_required: false
    review_status: pending_teacher_review
    version: 0.1.0

  - id: hypothesis_p_value_concept_01
    title: 从原假设正确解释 p 值与检验决策
    unit_id: hypothesis_testing
    concept_id: hypothesis_testing
    knowledge_node_ids: [ht_hypotheses, ht_p_value]
    prerequisites: [confidence_interval]
    difficulty: 0.68
    question_type: concept
    prompt: >-
      一项随机分组的 A/B 实验比较两版转化率，双侧检验设
      H0: p_B-p_A=0，H1: p_B-p_A≠0，预先设定 α=0.05，得到 p=0.032。哪项正确？
      A. 在 H0 和检验条件成立时，得到当前这么极端或更极端结果的概率为 0.032；
      因 p<α 而拒绝 H0，但不能说 H0 为真的概率是 3.2%，也不能仅凭 p 值说效应很大。
      B. p=0.032 表示 H0 为真的概率是 3.2%。
      C. p=0.032 表示 B 比 A 好的概率是 96.8%。
      D. 因为 0.032>0.05，所以不拒绝 H0。
      答案栏选一项，并说明假设、p 值的条件语境、阈值比较和结论边界。
    dataset:
      design: randomized_two_group_ab
      parameter: conversion_rate_difference
      null_hypothesis: p_b_minus_p_a_equals_0
      alternative_hypothesis: p_b_minus_p_a_not_equals_0
      alternative: two_sided
      alpha: 0.05
      p_value: 0.032
    expected_answer: A
    accepted_answers: [a, 选项A, 拒绝H0但p值不是H0为真的概率]
    numeric_tolerance: null
    rubric:
      - 写清 H0 是转化率差为 0，H1 是双侧不为 0
      - 在 H0 与检验条件成立的前提下解释当前或更极端数据的概率
      - 比较 0.032<0.05 并得出拒绝 H0
      - 不把 p 值当作 H0 为真、备择为真或效应很大的概率
    misconception_tags:
      - p_value_is_probability_null_true
      - p_value_is_probability_treatment_better
      - alpha_p_value_comparison_reversed
      - statistical_significance_proves_large_effect
      - p_value_context_unexplained
    dimension_weights: {concept: 0.55, calculation: 0.15, python: 0.00, interpretation: 0.30}
    evidence_policy:
      reasoning_required: true
      reasoning_support_groups:
        - [H0是两组总体转化率相等, H0是p_B-p_A=0, 原假设是转化率差为0, H0说两个版本的总体转化没有差别, 零假设规定总体差等于零]
        - [H1是双侧不相等, H1是p_B-p_A不为0, 备择假设是双侧差异, 双侧H1则说差值不为零, 双边备择允许正负差异]
        - [观察到当前或更极端结果的尾部概率为0.032, 假定原假设为真时观察到至少这么极端数据的概率是3.2%, p值是H0下当前或更极端的尾部概率, 像本次或更偏离零的统计量出现机会是0.032, 统计量达到样本所见或更极端的尾部面积是3.2%]
        - [0.032<0.05, p值小于alpha, p<α, 它低于alpha=.05, 3.2%比事先5%的门槛低]
        - [所以拒绝H0, 因而拒绝原假设, 故拒绝H0, 达到统计显著, 故否定H0, 按方案驳回零假设]
        - [p值不是H0为真的概率, 不能说H0为真概率是3.2%, p值不等于B更好的概率, 统计显著不说明效应很大, 还要看效应量与置信区间, 仍需效应量和CI, 显著也不量化差异幅度]
      reasoning_support_negation_guards: [不, 没, 不能, 不是, 并非, 不应, 不对, 错误, 不成立]
      reasoning_insufficient_rule:
        rule_id: p_value_context_unexplained
        message_zh: 还需写清原/备择假设、p 值在 H0 下的条件语境、阈值比较和结论边界。
        misconception_tag: p_value_context_unexplained
      relevance_terms: [原假设, 备择假设, H0, H1, p值, "0.032", "0.05", 拒绝]
      text_rules:
        - rule_id: p_value_is_probability_null_true
          source: reasoning
          dimension: concept
          verdict: contradicts
          phrases: [p值就是H0为真的概率, H0为真的概率是3.2%, 原假设只有3.2%概率为真, H0的可信度只剩3.2%, 原假设正确的可信度只剩3.2%, p本质上就是零假设的后验可信度]
          negation_guards: [不能说, 不是, 并非, 错误]
          message_zh: p 值是 H0 与检验条件下数据的尾部概率，不是 H0 为真的概率。
          misconception_tag: p_value_is_probability_null_true
        - rule_id: p_value_is_probability_treatment_better
          source: reasoning
          dimension: interpretation
          verdict: contradicts
          phrases: [B更好的概率是96.8%, 备择假设为真概率是96.8%, 1-p就是B有效的概率, 新版获胜的把握达到96.8%]
          negation_guards: [不能说, 不是, 并非, 错误]
          message_zh: 频率学派 p 值不直接给出备择假设或 B 更好的后验概率。
          misconception_tag: p_value_is_probability_treatment_better
        - rule_id: alpha_p_value_comparison_reversed
          source: reasoning
          dimension: calculation
          verdict: contradicts
          phrases: [0.032大于0.05, p值大于alpha所以不拒绝, 0.032>0.05]
          negation_guards: [不是, 并非, 不对, 错误]
          message_zh: 0.032 小于预先设定的 0.05，本题决策是拒绝 H0。
          misconception_tag: alpha_p_value_comparison_reversed
        - rule_id: statistical_significance_proves_large_effect
          source: reasoning
          dimension: interpretation
          verdict: contradicts
          phrases: [p值很小所以效应一定很大, 统计显著就代表实际收益很大, 显著即效果强, 显著便说明收益必然可观]
          negation_guards: [不能说, 不是, 并非, 错误]
          message_zh: p 值不表示效应大小；还需报告效应量、置信区间和实际阈值。
          misconception_tag: statistical_significance_proves_large_effect
      python_static_spec: null
    hints:
      concept_cue: 概念提示：p 值的概率语句是从“假设”到“数据”，还是从“数据”到“假设”？
      method_cue: 方法提示：先写出参数差的原/备择假设，再于 H0 前提下解释尾部概率，最后将 p 值与预设阈值比较。
      partial_step: 步骤提示：本题是双侧差异问题；把 0.032 放在数轴上与 0.05 比较，但不要把这个数改写成假设为真的概率。
      complete_explanation:
        concept: H0 规定转化率差为 0，H1 规定双侧差异；p 值是假定 H0 与检验条件成立时数据的尾部概率。
        calculation: 0.032<0.05，因此按预设决策规则拒绝 H0。
        python: 受审分析可用 SciPy 计算检验结果；本题不要求也不执行学习者代码。
        interpretation: 选 A。结果在 5% 阈值下统计显著，但 p 值不是 H0 为真或 B 更好的概率，也不表示效应大小。
    python_code_required: false
    review_status: pending_teacher_review
    version: 0.1.0

  - id: ab_welch_ttest_python_01
    title: 用 SciPy Welch t 检验分析合成 A/B 指标
    unit_id: hypothesis_testing
    concept_id: hypothesis_testing
    knowledge_node_ids: [ht_p_value, ht_ab_design]
    prerequisites: [confidence_interval]
    difficulty: 0.76
    question_type: python
    prompt: >-
      合成数据 `data/synthetic/ab_session_duration.csv` 来自两个独立随机组。系统已按组提供
      `variant_a` 和 `variant_b` 两个时长数组。使用 `stats.ttest_ind` 做不假设方差相等的双侧 Welch
      独立样本 t 检验，最终表达式只取 `.pvalue`。答案栏填 p 值，代码栏写表达式；
      说明两组均值差、p 值与 0.05 的比较，以及结论不能超过随机分组和合成样本的边界。
      学习者代码只做 AST 静态检查，绝不执行。
    dataset:
      source_path: data/synthetic/ab_session_duration.csv
      metric: session_duration_minutes
      variant_a: [70, 72, 68, 75, 69, 71, 73, 70]
      variant_b: [74, 76, 72, 78, 73, 75, 77, 74]
      design: independent_random_assignment
      test: welch_two_sided_independent_ttest
      alpha: 0.05
      mean_a: 71.0
      mean_b: 74.875
      mean_difference_b_minus_a: 3.875
    expected_answer: 0.002948258250101697
    numeric_tolerance: 0.000000001
    rubric:
      - 使用两个系统数组作为独立样本，不合并或复用同一组
      - 显式设定 equal_var=False 和 alternative=two-sided
      - 最终结果连通到 ttest_ind 的 pvalue 属性
      - 核对 A 均值 71、B 均值 74.875、差 3.875 和 p≈0.002948
      - 在 0.05 阈值下拒绝均值相等原假设，但不把合成小样本外推为无条件的现实因果结论
    misconception_tags:
      - pooled_ttest_used_when_welch_required
      - one_sided_test_used_for_two_sided_question
      - ttest_same_group_twice
      - ttest_result_not_pvalue
      - p_value_is_probability_null_true
      - welch_test_boundary_unexplained
      - welch_ttest_structure_mismatch
      - unsafe_code_execution_request
    dimension_weights: {concept: 0.10, calculation: 0.20, python: 0.55, interpretation: 0.15}
    evidence_policy:
      reasoning_required: true
      reasoning_support_groups:
        - [A组均值是71而B组是74.875, mean_a=71mean_b=74.875, B比A高3.875, 均值差为3.875, 后者多出3.875分钟]
        - [p值约0.002948, p=0.002948258250101697, p值小于0.05, 0.002948<0.05, 概率值约.002948]
        - [拒绝两组均值相等的H0, 在0.05阈值下拒绝H0, 该双侧差异达到统计显著, 所以否定均值相同]
        - [不能超出随机分组与合成样本边界, 合成小样本不能代表所有现实用户, 因果解释依赖随机化和实验执行, 还需报告效应量与置信区间, 这只能演示当前随机化设定]
      reasoning_support_negation_guards: [不, 没, 不能, 不是, 并非, 不应, 不对, 错误, 不成立]
      reasoning_insufficient_rule:
        rule_id: welch_test_boundary_unexplained
        message_zh: 还需核对两组均值与差、p 值和决策，并限定合成随机样本的解释边界。
        misconception_tag: welch_test_boundary_unexplained
      relevance_terms: [Welch, ttest_ind, equal_var, two-sided, pvalue, "3.875", "0.002948", 随机分组]
      text_rules:
        - rule_id: p_value_is_probability_null_true
          source: reasoning
          dimension: concept
          verdict: contradicts
          phrases: [p值就是H0为真的概率, 原假设为真的概率是0.2948%, 0.002948是均值相等的概率, 均值相等的可信度就是0.2948%]
          negation_guards: [不能说, 不是, 并非, 错误]
          message_zh: p 值是 H0 下数据的尾部概率，不是均值相等假设为真的概率。
          misconception_tag: p_value_is_probability_null_true
      python_static_spec:
        structure_kind: direct_welch_ttest_pvalue
        variants:
          - required_calls: [stats.ttest_ind]
            required_names: [variant_a, variant_b]
            allowed_root_kinds: [Attribute]
            required_constants: ["false", two-sided]
          - required_calls: [scipy.stats.ttest_ind]
            required_names: [variant_a, variant_b]
            allowed_root_kinds: [Attribute]
            required_constants: ["false", two-sided]
        mismatch_rules:
          - rule_id: pooled_ttest_used_when_welch_required
            kind: pooled_ttest_for_welch_question
            message_zh: 本题指定 Welch 检验，必须显式使用 equal_var=False。
            misconception_tag: pooled_ttest_used_when_welch_required
          - rule_id: one_sided_test_used_for_two_sided_question
            kind: one_sided_ttest_for_two_sided_question
            message_zh: 本题的备择假设是双侧，不能改成 less 或 greater 单侧检验。
            misconception_tag: one_sided_test_used_for_two_sided_question
          - rule_id: ttest_same_group_twice
            kind: ttest_same_group_twice
            message_zh: 两个参数必须分别连接 variant_a 和 variant_b，不能重复比较同一组。
            misconception_tag: ttest_same_group_twice
          - rule_id: ttest_result_not_pvalue
            kind: ttest_result_without_pvalue
            message_zh: ttest_ind 返回检验结果对象，本题要求最终结果明确连接到 .pvalue。
            misconception_tag: ttest_result_not_pvalue
        mismatch_rule_id: welch_ttest_structure_mismatch
        mismatch_message_zh: 代码必须是两个系统数组的双侧 Welch ttest_ind 并以 .pvalue 为最终结果；系统未执行代码。
        misconception_tag: welch_ttest_structure_mismatch
    hints:
      concept_cue: 概念提示：两组是独立观测，题目是否允许假设两个总体方差相等？
      method_cue: 方法提示：选择独立样本 t 检验，明确关闭等方差假设、保留双侧备择，并只取检验结果的概率字段。
      partial_step: 步骤提示：先核对两个数组各自的均值，再构造以两个系统变量为前两个参数、带有两个明确关键字的 ttest_ind 调用。
      complete_explanation:
        concept: Welch 独立样本 t 检验比较两组总体均值，不要求两组方差相等；双侧备择关心任一方向的差异。
        calculation: A 均值为 71，B 均值为 74.875，B-A=3.875；p≈0.0029482583<0.05。
        python: 受审表达式为 stats.ttest_ind(variant_b, variant_a, equal_var=False, alternative="two-sided").pvalue；系统只做 AST 检查，不执行它。
        interpretation: 在设定的双侧 5% 阈值下拒绝均值相等的 H0；这份合成小样本只用于教学，现实因果结论还依赖随机化执行、数据质量和外部适用性。
    python_code_required: true
    review_status: pending_teacher_review
    version: 0.1.0

  - id: hypothesis_errors_power_concept_01
    title: 区分一类错误、二类错误与检验功效
    unit_id: hypothesis_testing
    concept_id: hypothesis_testing
    knowledge_node_ids: [ht_hypotheses, ht_errors_power]
    prerequisites: [confidence_interval]
    difficulty: 0.72
    question_type: concept
    prompt: >-
      团队预先设 H0：新版本没有提升，H1：新版本有正向提升，并只在拒绝 H0 后上线。
      哪项正确？
      A. 一类错误是实际无提升却误上线；二类错误是存在规定的真实提升却未拒绝 H0；
      功效是在该具体真实提升下正确拒绝 H0 的概率。其他条件相同时增大样本量通常提高功效，
      但不会改变真实效应、消除偏差或保证必然显著。
      B. 一类错误是漏掉真提升，二类错误是误报无效版本。
      C. 功效是 H0 为真时不拒绝 H0 的概率。
      D. 样本量足够大时一类和二类错误、抽样偏差都会归零。
      选一项并分别说明两类错误、功效和样本量的作用边界。
    dataset:
      null_hypothesis: no_positive_lift
      alternative_hypothesis: positive_lift
      decision_action: launch_when_null_rejected
    expected_answer: A
    accepted_answers: [a, 选项A, 误上线是一类漏提升是二类]
    numeric_tolerance: null
    rubric:
      - 一类错误是 H0 真却被拒绝，在情境中对应误上线
      - 二类错误是具体 H1 真却未拒绝 H0，在情境中对应漏掉真提升
      - 功效是指定真实效应下拒绝 H0 的概率
      - 说明样本量通常提高功效但不改变效应、不修复偏差且不保证显著
    misconception_tags: [type_i_type_ii_reversed, power_definition_reversed, larger_sample_guarantees_significance, sample_size_removes_design_bias, errors_power_boundary_unexplained]
    dimension_weights: {concept: 0.55, calculation: 0.05, python: 0.00, interpretation: 0.40}
    evidence_policy:
      reasoning_required: true
      reasoning_support_groups:
        - [H0真而拒绝的一类错误, 实际无提升却误上线是一类错误, 一类错误是误报效果, 犯的是第一类, 空效果存在却被我们拒绝并发布]
