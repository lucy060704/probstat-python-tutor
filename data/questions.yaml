  - id: ab_effect_significance_interpretation_01
    title: 区分统计显著、效应量和实际重要性
    unit_id: hypothesis_testing
    concept_id: hypothesis_testing
    knowledge_node_ids: [ht_p_value, ht_ab_design]
    prerequisites: [confidence_interval]
    difficulty: 0.78
    question_type: interpretation
    prompt: >-
      一项执行完整的随机 A/B 实验报告：A 转化率 10.00%，B 为 10.15%；绝对差 B-A=0.15
      个百分点，95% 置信区间为 [0.06, 0.24] 个百分点，p=0.001。团队在看数据前规定：
      绝对提升至少 1 个百分点才具有业务实际意义。哪项正确？
      A. 差异在 5% 阈值下统计显著，但点估计和整个区间都低于预设的 1 个百分点实际阈值，
      因此不应仅凭显著性宣称具有实际重要性；因果解释仍依赖随机化和实验执行，外推还受受试人群限制。
      B. p=0.001 证明 B 的实际收益一定很大。
      C. 0.15% 与 0.15 个百分点完全相同，相对提升也是 0.15%。
      D. 随机分组保证结论对所有用户、所有时间和任何产品都成立。
      选一项并说明显著性、绝对效应、区间、实际阈值与外部适用性。
    dataset:
      design: randomized_ab_complete_execution
      conversion_rate_a: 0.10
      conversion_rate_b: 0.1015
      absolute_difference_percentage_points: 0.15
      relative_lift_percent: 1.5
      confidence_interval_percentage_points: [0.06, 0.24]
      p_value: 0.001
      alpha: 0.05
      minimum_practical_effect_percentage_points: 1.0
    expected_answer: A
    accepted_answers: [a, 选项A, 统计显著但未达实际阈值]
    numeric_tolerance: null
    rubric:
      - p<0.05 且区间排除 0，说明统计显著
      - 绝对效应为 0.15 个百分点，相对提升为 1.5%，两者不得混淆
      - 点估计与区间上限 0.24 都低于预设的 1 个百分点实际阈值
      - 随机化支持特定实验范围内的因果解释，但不保证无限外推
    misconception_tags: [statistical_significance_proves_large_effect, percentage_point_relative_change_confused, confidence_interval_practical_threshold_ignored, randomization_guarantees_external_validity, effect_practical_boundary_unexplained]
    dimension_weights: {concept: 0.20, calculation: 0.20, python: 0.00, interpretation: 0.60}
    evidence_policy:
      reasoning_required: true
      reasoning_support_groups:
        - [p=0.001小于0.05所以统计显著, 95%区间排除0, 差异统计显著, 故统计上显著, 因此统计上有差异]
        - [绝对差为0.15个百分点, 绝对差是0.15个百分点, B-A=0.15个百分点, 10.00%到10.15%差0.15个百分点, B比A高0.15个百分点]
        - [相对提升为1.5%, 相对提升是1.5%, 百分点与百分比不同, 相对基线是1.5%, 相对A是1.5%]
        - [点估计和区间上限0.24都低于1个百分点, 0.15和区间上限0.24都低于1个百分点, 点估计和整个区间都未达实际阈值, 估计值和上界均不到事先要求的1个百分点, 无论中心还是上端都没有达到事前定下的1个百分点门槛]
        - [随机化支持本实验范围内的因果解释, 结论依赖随机分组完整执行, 随机分派只支撑当前实验里的因果, 随机指派支持这次试验对象内的因果判断]
        - [外推仍受受试人群和实施条件限制, 不能保证对所有用户时间场景成立, 换人群或时间仍需验证, 换市场或时期仍要再验证]
      reasoning_support_negation_guards: [不, 没, 不能, 不是, 并非, 不应, 不对, 错误, 不成立]
      reasoning_insufficient_rule:
        rule_id: effect_practical_boundary_unexplained
        message_zh: 还需同时核对统计显著、绝对/相对效应、区间与实际阈值，并限定外推范围。
        misconception_tag: effect_practical_boundary_unexplained
      relevance_terms: [统计显著, 效应量, 百分点, 相对提升, 置信区间, 实际阈值, 随机分组, 外推]
      text_rules:
        - rule_id: statistical_significance_proves_large_effect
          source: reasoning
          dimension: interpretation
          verdict: contradicts
          phrases: [p值很小所以实际收益一定很大, 统计显著就必然有业务价值, 显著性证明效应很大, 小p本身已经证明商业影响巨大]
          negation_guards: [不能说, 不是, 并非, 错误]
          message_zh: 统计显著不表示效应必然很大或达到预设的实际阈值。
          misconception_tag: statistical_significance_proves_large_effect
        - rule_id: percentage_point_relative_change_confused
          source: reasoning
          dimension: calculation
          verdict: contradicts
          phrases: [0.15%与0.15个百分点完全相同, 相对提升也是0.15%, 10%到10.15%是增长0.15%, 0.15个百分点也就是0.15%的相对涨幅]
          negation_guards: [不是, 并非, 不对, 错误]
          message_zh: 10.00% 到 10.15% 的绝对差是 0.15 个百分点，相对提升是 1.5%。
          misconception_tag: percentage_point_relative_change_confused
        - rule_id: confidence_interval_practical_threshold_ignored
          source: reasoning
          dimension: interpretation
          verdict: contradicts
          phrases: [区间排除0就说明达到1个百分点, 只要置信区间不含0就有实际价值, 不用比较实际阈值, CI避开0便自动越过业务门槛]
          negation_guards: [不能说, 不是, 并非, 错误]
          message_zh: 区间排除 0 只回答统计显著边界；实际重要性还必须与预先规定的效应阈值比较。
          misconception_tag: confidence_interval_practical_threshold_ignored
        - rule_id: randomization_guarantees_external_validity
          source: reasoning
          dimension: interpretation
          verdict: contradicts
          phrases: [随机分组保证对所有用户都成立, 随机实验可以无限外推, 随机化证明任何时间任何人群都有效, 随机分配使结论在任何地区都通用, 随机化以后就拥有跨地区跨时间的普适性]
          negation_guards: [不能说, 不是, 并非, 错误]
          message_zh: 随机化主要支持试验范围内的内部因果效度，不自动保证对任意人群或时间的外部效度。
          misconception_tag: randomization_guarantees_external_validity
      python_static_spec: null
    hints:
      concept_cue: 概念提示：“差异很难用随机波动解释”与“差异大到值得上线”是同一个问题吗？
      method_cue: 方法提示：先用 p 值和区间判断统计显著，再把效应点估计与整个区间同预设业务阈值比较。
      partial_step: 步骤提示：区间没有跨过 0，但它的上限也没有接近预设的 1 个百分点；同时分开绝对百分点与相对比例。
      complete_explanation:
        concept: 统计显著性针对随机误差下的检验阈值，实际重要性则需要事先定义的业务或教学效应阈值。
        calculation: B-A=0.15 个百分点，相对提升为 0.15/10=1.5%；[0.06,0.24] 排除 0 但整体低于 1 个百分点。
        python: 受审分析可同时输出效应量、区间和 p 值；本题不执行学习者代码。
        interpretation: 选 A。差异统计显著却没有达到预设的实际重要阈值；随机化不会自动赋予无限外推性。
    python_code_required: false
    review_status: pending_teacher_review
    version: 0.1.0

  - id: ab_design_multiplicity_interpretation_01
    title: 识别多重比较、自选分组和差异流失风险
    unit_id: hypothesis_testing
    concept_id: hypothesis_testing
    knowledge_node_ids: [ht_errors_power, ht_ab_design]
    prerequisites: [data_quality, joint_correlation, confidence_interval]
    difficulty: 0.84
    question_type: interpretation
    prompt: >-
      团队没有预先指定主指标，看完数据后从 20 个指标中只报告唯一 p=0.03 的结果；
      用户可自己选新界面，且新界面组流失率为 18%、旧界面组为 5%。为说明多重比较风险，
      若 20 个独立的真原假设都分别用 α=0.05，至少一次假阳性的概率为 1-0.95^20≈0.6415。
      哪项正确？
      A. 现有 p=0.03 不足以支持确证性因果结论；应预注册主指标或校正多重比较，真正随机分组并检查分配，
      同时报告分组流失、效应量、区间和敏感性分析。
      B. 只要有一个 p<0.05，20 个指标中必有一个真实改善。
      C. 自选分组等价于随机化，所以两组差异可直接解释为因果效应。
      D. 只需删掉所有流失用户，18% 与 5% 的差异不会影响结论。
      选一项，并说明 0.6415 的计算、多重比较、分组方式和差异流失。
    dataset:
      primary_metric_prespecified: false
      inspected_metrics: 20
      reported_p_value: 0.03
      per_test_alpha: 0.05
      independent_nulls_for_risk_illustration: true
      probability_at_least_one_false_positive: 0.6415140775914581
      assignment: self_selection
      attrition_rate_new_ui: 0.18
      attrition_rate_old_ui: 0.05
    expected_answer: A
    accepted_answers: [a, 选项A, 需校正多重比较随机分组并审计流失]
    numeric_tolerance: null
    rubric:
      - 计算并解释 1-0.95^20≈0.6415 只是题设独立真原假设下的至少一次假阳性风险
      - 说明事后挑选单一 p<0.05 会产生多重比较和选择性报告风险
      - 说明自选新界面不是随机分组，存在混杂与选择偏差
      - 说明 18% 与 5% 的差异流失可以改变留存样本构成，不能直接删除后忽略
    misconception_tags: [multiple_comparisons_ignored, familywise_error_calculation_wrong, self_selection_treated_as_randomization, differential_attrition_ignored, ab_design_validity_unexplained]
    dimension_weights: {concept: 0.25, calculation: 0.20, python: 0.00, interpretation: 0.55}
    evidence_policy:
      reasoning_required: true
      reasoning_support_groups:
        - [至少一次假阳性是1-0.95^20, 1-0.95^20约0.6415, 二十次独立检验全部不假阳性是0.95的20次方, 全都不误报的概率是.95^20, 零误报机会为0.95的二十次幂]
        - [约64.15%, 至少一次假阳性概率约64.15%, 结果约为0.6415, 补集约.6415, 至少一个误报的补概率约64.15%]
        - [事后只挑p=0.03有多重比较和选择性报告风险, 事后从20个指标只挑p=0.03有多重比较风险, 选择性报告会放大假阳性, 看完才挑唯一显著项属于多测与选择报告, 结果出来后再挑最小p属于多指标筛选]
        - [应预注册主指标或校正, 应预注册主指标或做多重校正, 应用预注册或校正, 应先登记主指标或调节阈值]
        - [用户自选不是随机分组, 自选组存在混杂或选择偏差, 不能把自选差异直接解释为因果, 用户自己选版本会混杂, 自己选择界面不能形成随机组]
        - [18%与5%的差异流失需要审计, 流失不平衡可能改变两组留存样本构成, 不能删掉流失者后忽略偏差, 应报告效应量区间与敏感性分析, 需披露并做敏感性分析, 18%和5%的退出差也会改变可分析人群]
      reasoning_support_negation_guards: [不, 没, 不能, 不是, 并非, 不应, 不对, 错误, 不成立]
      reasoning_insufficient_rule:
        rule_id: ab_design_validity_unexplained
        message_zh: 还需同时说明多重检验概率、事后挑选、自选分组和差异流失的证据与修正方向。
        misconception_tag: ab_design_validity_unexplained
      relevance_terms: [多重比较, 假阳性, "0.6415", 预注册, 随机分组, 自选, 流失, 18%, 5%]
      text_rules:
        - rule_id: multiple_comparisons_ignored
          source: reasoning
          dimension: concept
          verdict: contradicts
