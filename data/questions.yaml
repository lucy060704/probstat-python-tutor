    prompt: >-
      目标参数固定为 θ=100。按同一总体重复抽样时，估计量 A 的期望为 100、标准差为 6；
      估计量 B 的期望为 103、标准差为 2。以下哪项正确？
      A. A 无偏，所以 A 的均方误差一定更小；
      B. Bias(A)=0、MSE(A)=36；Bias(B)=3、MSE(B)=13，所以 B 虽有偏但均方误差更小；
      C. B 的标准差较小，所以 B 一定无偏；
      D. 估计量就是某一次得到的估计值 103，不能讨论重复抽样分布。
