          verdict: contradicts
          phrases: [删掉所有流失用户就没有影响, 18%与5%的流失差异可以忽略, 只分析留下的用户就一定无偏, 把退出者去掉即可恢复无偏]
          negation_guards: [不能说, 不是, 并非, 错误]
          message_zh: 两组差异流失会改变留存样本构成，需要报告、追踪并做合理敏感性分析。
          misconception_tag: differential_attrition_ignored
      python_static_spec: null
