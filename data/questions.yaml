          misconception_tag: seed_guarantees_accuracy
        - rule_id: count_confused_with_proportion
          source: reasoning
          dimension: calculation
          verdict: contradicts
          phrases: [5041 就是模拟比例, 58 就是正面概率, 成功次数不需要除以试验次数]
          negation_guards: [不是, 不能, 不应]
          message_zh: 成功次数需要除以总试验次数才是模拟比例。
          misconception_tag: count_confused_with_proportion
      python_static_spec: null
    hints:
