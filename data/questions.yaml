        calculation: 若方法满足条件，长期大量重复构造的区间中约 95% 覆盖真实参数；有限 100 次不保证恰好 95 次。
        python: Python 可以重复模拟并估计覆盖比例，但有限模拟比例不是对长期理论性质的证明。
