        - [近似, 不保证精确, 渐近逼近, 只是一种逼近, 近似也不等于精确保证]
      reasoning_support_negation_guards: [不是, 不能]
      reasoning_insufficient_rule:
        rule_id: sampling_distribution_clt_boundary_unexplained
        message_zh: 理由尚未同时说明抽样分布对象、中心极限定理条件、中心与标准误以及近似边界。
        misconception_tag: sampling_distribution_clt_boundary_unexplained
      relevance_terms: [总体, 样本, 样本均值, 抽样分布, 中心极限定理, 标准误, CLT]
      text_rules:
        - rule_id: raw_data_becomes_normal_under_clt
          source: reasoning
          dimension: concept
          verdict: contradicts
          phrases: [中心极限定理把原始数据变成正态, 原始观测会变成正态, 每个个体会被变成正态, CLT 近似的是原始数据分布, 被拉成钟形的是每批64个观测本身, 每批64个观测本身变成钟形, 底层观测会成为钟形]
          negation_guards: [不会, 不能, 不是, 不表示]
          message_zh: 中心极限定理近似的是适用统计量的抽样分布，不会改变原始观测的分布。
          misconception_tag: raw_data_becomes_normal_under_clt
        - rule_id: single_sample_is_sampling_distribution
          source: reasoning
