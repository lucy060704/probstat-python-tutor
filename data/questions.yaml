      method_cue: 方法提示：确定中心极限定理近似的对象与条件，再分别写出样本均值抽样分布中心和尺度的一般公式。
      partial_step: 步骤提示：每轮只保存一个样本均值；把总体标准差放在样本量平方根的分母上，同时检查原总体形状是否因此改变。
      complete_explanation:
        concept: 2000 次重复抽样各产生一个样本均值，这些均值形成抽样分布的经验近似；中心极限定理近似的是均值统计量的抽样分布，而非原始个体分布。
        calculation: E(X̄)=μ=50，SE(X̄)=σ/√n=16/√64=2。
        python: 教学演示可用受审随机数生成器重复计算均值并画直方图；有限模拟只帮助观察，不构成定理证明，也不执行学习者代码。
        interpretation: 选择 A。独立随机抽样、有限方差和足够样本量支持近似；原始总体仍可右偏，近似不等于精确保证。
