      method_cue: 方法提示：分别用“成功次数÷试验次数”得到模拟比例，再判断增大次数表达的是通常趋势还是逐次保证。
      partial_step: 步骤提示：两次比例分别是 58/100=0.58 和 5041/10000=0.5041；它们与 0.5 的绝对差分别是 0.08 和 0.0041。
