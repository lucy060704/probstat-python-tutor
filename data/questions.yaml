        python: 固定参考程序可用成功次数除以试验次数得到比例；随机种子只支持复现，不决定理论概率。
        interpretation: 应选 C。更多重复通常减小模拟波动，但不保证每个更大的单次运行都单调地更接近理论概率，模拟也不会改写理论概率。
