          negation_guards: [不能说, 并非, 不是, 不应]
          message_zh: 题设中的独立随机抽样、有限方差和足够样本量是本例使用中心极限定理近似的条件。
          misconception_tag: clt_conditions_ignored
      python_static_spec: null
    hints:
