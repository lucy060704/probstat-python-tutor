  - id: confidence_interval_concept_01
    title: 正确理解 95% 置信水平
    unit_id: estimation_confidence_interval
    concept_id: confidence_interval
    knowledge_node_ids: [ec_interval_construction, ec_interval_interpretation]
    prerequisites: [sampling_standard_error]
    difficulty: 0.55
    question_type: concept
    prompt: >-
      对同一总体按相同设计重复抽样，并用同一种有效方法构造许多 95% 置信区间。哪项解释正确？
      A. 长期重复中，约 95% 的区间会覆盖固定但未知的总体参数；
      B. 对已经算出的这一个区间，参数有 95% 的概率位于其中；
      C. 每个区间都包含约 95% 的原始观测；
      D. 任意连续 100 个区间都保证恰好 95 个覆盖参数。
