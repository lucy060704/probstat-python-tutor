source_schema_version: "1.0"
source_id: point_estimation_bias_variability_core
version: "0.1.0"
title: 点估计、偏差、方差与均方误差
language: zh-CN
concept_id: confidence_interval

learning_objectives:
  - 区分总体参数、估计量和一次样本得到的估计值。
  - 在重复抽样框架下解释估计量的偏差和方差。
  - 使用均方误差同时比较系统偏移和随机波动。
  - 区分估计量的数学偏差与数据收集中的选择或测量偏差。

prerequisite_knowledge:
  - 理解总体、样本、统计量和抽样分布。
  - 能计算期望、方差、标准差和平方。

concept_explanation:
  - >-
    参数是总体的固定未知特征。估计量是预先定义的样本函数；换一份样本，估计量的取值通常会变，
    因而可以讨论它的抽样分布。估计值是把估计量应用于某一份样本后得到的具体数值。
  - >-
    估计量的偏差比较其重复抽样期望与目标参数。偏差为零称为无偏，但无偏只描述长期中心，
    不保证某一次估计值等于参数，也不保证随机波动最小。
  - >-
    方差描述估计量跨可能样本的随机波动。均方误差把方差和偏差平方放在同一平方损失口径下，
    因此一个略有偏但波动较小的估计量，可能具有更小的均方误差。
  - >-
    估计量的数学偏差是在给定数据生成与抽样模型下定义的性质。抽样框遗漏、无应答、便利抽样或
    仪器偏移属于数据收集机制问题；即使代数估计量在理想模型下无偏，这些问题仍可能移动实际结果。

formula_explanation:
  - name: 估计量偏差
    expression: "Bias(T)=E(T)-θ"
    symbols:
      T: 用样本估计参数的统计量
      E_T: 估计量在重复抽样下的期望
      theta: 目标总体参数
    meaning: 正值表示估计量长期中心高于目标，负值表示长期中心低于目标。
    assumptions:
      - 目标参数和估计量已经明确定义。
      - 期望基于规定的数据生成与抽样机制。
    cautions:
      - 不能由一次估计值高于或低于参数来判定估计量是否有偏。
      - 改变抽样机制后，偏差性质可能随之改变。
  - name: 均方误差分解
    expression: "MSE(T)=E[(T-θ)²]=Var(T)+Bias(T)²"
    symbols:
      MSE: 相对目标参数的平均平方误差
      Var_T: 估计量的重复抽样方差
      Bias_T: 估计量的重复抽样偏差
    meaning: 平方损失下，总误差由随机波动和系统偏移的平方共同组成。
    assumptions:
      - 二阶矩存在。
      - 比较的估计量针对同一参数并使用同一损失口径。
    cautions:
      - 偏差必须平方，不能把带符号偏差直接与方差相加。
      - 方差和均方误差的单位是参数单位的平方。

python_connection:
  - library: NumPy
    api: mean、var 与重复模拟数组
    purpose: 在维护者控制的模拟中汇总估计量的经验中心、方差和均方误差。
    input_expectation: 每一行或每一列必须明确对应一次独立重复及同一个估计规则。
    interpretation_caution: 有限模拟只能近似理论性质，不能替代数学推导或真实抽样设计审查。
  - library: pandas
    api: groupby 与聚合
    purpose: 按估计方法汇总受控重复实验的经验偏差、方差和平方误差。
    input_expectation: 分组标签、目标参数和重复编号必须定义清楚。
    interpretation_caution: 对一份观察数据分组不能自动产生估计量的重复抽样分布。

data_interpretation_guidance:
  - 报告点估计时同时写清估计的总体参数、估计规则和数据来源。
  - 比较估计方法时分别报告偏差、标准误或方差，以及采用的损失或决策口径。
  - 不把“无偏”写成“每次都准确”，也不把“低方差”写成“没有系统偏移”。
  - 数据收集偏差需要设计、审计或敏感性分析证据，不能靠增加样本量自动消除。

common_misconceptions:
  - misconception: 估计量就是一次样本得到的固定数字。
    why_incorrect: 估计量是样本函数并随可能样本变化，固定数字是这条规则的一次实现。
    better_question: 如果重新抽取一份样本，同一计算规则的结果是否可能改变？
  - misconception: 无偏估计量在任何评价标准下都一定最好。
    why_incorrect: 无偏只约束长期中心；均方误差还包括估计量方差。
    better_question: 两个估计量的偏差、方差和所采用的损失函数分别是什么？
  - misconception: 均方误差等于方差加偏差。
    why_incorrect: 正确分解使用偏差的平方，使两部分处于相同的平方单位。
    better_question: 方差的单位是什么，带符号偏差怎样转换到相同单位？
  - misconception: 样本量足够大就会消除便利抽样或测量偏差。
    why_incorrect: 更大样本通常减少随机波动，却可能更精确地围绕一个错误中心。
    better_question: 误差来自随机抽样波动，还是来自每次都朝同一方向的收集机制？

reflective_questions:
  - 为什么估计量无偏仍可能在某一次样本上离参数很远？
  - 在什么评价口径下，略有偏但方差较小的估计量可能更合适？
  - 如何用可观察的数据收集证据区分数学估计量偏差与抽样框偏差？

summary:
  - 参数固定未知，估计量是跨样本变化的规则，估计值是一次具体结果。
  - 偏差描述长期中心，方差描述随机波动，均方误差等于方差加偏差平方。
  - 无偏不等于每次准确，低方差不等于无偏，增加样本量也不能自动修复系统性数据偏差。
