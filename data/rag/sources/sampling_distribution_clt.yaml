source_schema_version: "1.0"
source_id: sampling_distribution_clt_core
version: "0.1.0"
title: 抽样分布与中心极限定理
language: zh-CN
concept_id: sampling_standard_error

learning_objectives:
  - 区分目标总体、抽样框、单份样本、总体参数和样本统计量。
  - 用重复抽样解释统计量的抽样分布，而不与原始数据分布混淆。
  - 说明中心极限定理的近似对象、常见条件和有限样本边界。
  - 连接样本均值抽样分布的中心、标准误与后续统计推断。

prerequisite_knowledge:
  - 理解随机变量、均值、方差和标准差。
  - 理解独立性以及随机抽样只是研究设计假设的一部分。
  - 能区分理论概率关系与有限次随机模拟结果。

concept_explanation:
  - >-
    目标总体是研究结论希望描述的对象集合；抽样框是实际有机会被抽到的对象列表；样本是一次
    抽取后观察到的数据。总体参数描述总体，样本统计量由样本计算。抽样框与目标总体不一致时，
    即使样本很大也可能有覆盖偏差。
  - >-
    抽样分布是同一种抽样设计下重复抽样、每次计算同一个统计量后，这个统计量跨样本形成的
    概率分布。一份样本内原始观测的直方图不是样本均值的抽样分布。
  - >-
    对独立同分布、均值和方差有限的观测，样本量增大时，标准化样本均值的分布趋近标准正态。
    近似对象是样本均值统计量，不是原始个体数据，也不是把右偏总体改造成正态总体。
  - >-
    “样本量大”没有适用于所有总体的固定神奇阈值。偏度、重尾、极端值、依赖结构和抽样设计
    都会影响有限样本近似；方差不存在时，经典形式不能直接套用。
  - >-
    总体本身正态且观测独立时，样本均值可得到精确的正态分布；对一般总体，中心极限定理通常
    提供渐近近似。有限次模拟能够展示形状趋势，但不是数学证明。

formula_explanation:
  - name: 样本均值抽样分布的中心与方差
    expression: "E(X̄)=μ，Var(X̄)=σ²/n，SD(X̄)=σ/√n"
    symbols:
      X_bar: 一份随机样本的样本均值
      mu: 目标总体均值
      sigma: 目标总体标准差
      n: 每份样本的观测数
    meaning: 在适用的独立同分布条件下，样本均值以总体均值为中心，跨样本波动随样本量平方根缩小。
    assumptions:
      - 观测来自同一目标总体且具有有限方差。
      - 观测独立，或依赖结构已由合适的抽样理论处理。
      - 这里描述同一种设计下统计量的重复抽样性质。
    cautions:
      - 使用样本标准差代替未知总体标准差得到的是估计标准误。
      - 无放回抽样比例较高时可能需要有限总体修正。
  - name: 中心极限定理的标准化形式
    expression: "(X̄-μ)/(σ/√n) 近似服从 N(0,1)"
    symbols:
      X_bar: 样本均值
      mu: 总体均值
      sigma_over_sqrt_n: 样本均值的标准误
    meaning: 以总体均值居中并用标准误缩放后，样本均值在适用条件和足够样本量下具有近似标准正态形状。
    assumptions:
      - 独立同分布是入门课程中的常用版本。
      - 总体均值和方差存在。
      - 样本量相对于总体偏度与尾部程度足以支持所需近似质量。
    cautions:
      - 近似质量需要结合情境检查，不能用一个固定样本量阈值保证。
      - 该结果不消除选择偏差、测量偏差或混杂。
  - name: 大数定律与中心极限定理的边界
    expression: "X̄→μ 与 标准化的 X̄ 近似正态 是不同结论"
    symbols:
      convergence: 样本均值随样本量增加靠近总体均值
      shape: 标准化统计量的分布形状
    meaning: 大数定律主要说明收敛，中心极限定理主要说明适当标准化后的分布形状。
    assumptions:
      - 两类结论都需要各自的概率条件。
    cautions:
      - 收敛不等于每份有限样本都准确。
      - 近似正态不等于原始数据正态。

python_connection:
  - library: NumPy
    api: numpy.random.Generator 与 numpy.mean
    purpose: 由维护者控制随机种子，重复生成样本并保存每份样本的均值，以展示经验抽样分布。
    input_expectation: 明确总体生成机制、每份样本量、重复次数和随机种子，并把原始观测与统计量分开保存。
    interpretation_caution: 模拟频数依赖随机种子和重复次数，只能支持直觉与程序验证，不能替代理论条件。
  - library: NumPy
    api: numpy.std 与 numpy.sqrt
    purpose: 在受审参考程序中比较样本内标准差和样本均值跨重复样本的标准差。
    input_expectation: 明确 axis、ddof、有效样本量和数组每个维度的语义。
    interpretation_caution: 相同函数名出现在不同数组上时统计对象不同；API 不会自动判断抽样设计是否合理。

data_interpretation_guidance:
  - 先问“分布中的每一个点是什么”：个体观测、一次样本均值，还是别的统计量。
  - 报告经验抽样分布时同时说明每份样本量、重复次数、抽样设计和所计算统计量。
  - 观察到近似钟形只能作为诊断信息，不能证明总体正态或抽样无偏。
  - 聚类、时间依赖和重复测量会降低有效独立信息量，应使用与设计匹配的方法。
  - 选择偏差改变统计量围绕哪个目标波动；减小标准误不能把错误中心移回真实参数。

common_misconceptions:
  - misconception: 一份样本内原始观测的分布就是样本均值的抽样分布。
    why_incorrect: 前者的每个点是个体观测，后者的每个点来自一份样本的统计量。
    better_question: 当前图中一个点代表一个人，还是一次重复抽样得到的均值？
  - misconception: 中心极限定理会让原始数据随着样本量增加变成正态。
    why_incorrect: 定理近似的是标准化统计量的抽样分布，原始总体形状并未改变。
    better_question: 被近似为正态的随机对象究竟是什么？
  - misconception: 只要样本量超过一个固定阈值，任何抽样分布都精确正态。
    why_incorrect: 定理是渐近结论，有限样本质量还受尾部、偏度、方差存在性和依赖结构影响。
    better_question: 当前总体和抽样设计是否满足条件，所需近似精度是多少？
  - misconception: 重复模拟看起来正态，就证明抽样设计无偏。
    why_incorrect: 模拟可以围绕一个错误目标稳定波动；偏差与抽样分布形状是不同问题。
    better_question: 模拟的数据生成机制是否真实代表目标总体和实际抽样过程？

reflective_questions:
  - 为什么同一总体的多份随机样本会得到不同样本均值？
  - 若图中每个点代表一次样本均值，应怎样解释该图的中心和宽度？
  - 一个高度右偏或重尾总体会怎样影响有限样本下的近似速度？
  - 为什么更窄的抽样分布仍可能围绕一个有偏的位置？

summary:
  - 总体、单份样本、样本统计量和统计量的抽样分布是四个不同层次。
  - 中心极限定理近似适用统计量的抽样分布，不改变原始数据分布。
  - 样本均值通常以总体均值为中心，并以总体标准差除以样本量平方根作为抽样波动尺度。
  - 独立性、有限方差、总体尾部和抽样设计决定简单公式及正态近似是否可信。
