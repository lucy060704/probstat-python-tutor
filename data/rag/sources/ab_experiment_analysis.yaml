source_schema_version: "1.0"
source_id: ab_experiment_analysis_core
version: "0.1.0"
title: A/B 实验设计、效应解释与有效性审计
language: zh-CN
concept_id: hypothesis_testing

learning_objectives:
  - 明确随机化单位、分配组、暴露、结局和分析单位。
  - 区分二元指标的绝对百分点差与相对提升。
  - 联合报告效应量、置信区间、p 值和预先规定的实际阈值。
  - 识别自选分组、差异流失、多重比较、提前停止和无限外推的风险。

prerequisite_knowledge:
  - 理解数据质量、分组汇总、抽样偏差、置信区间和 p 值。
  - 能区分相关性、随机化支持的因果解释和外部适用性。

concept_explanation:
  - >-
    A/B 实验先明确谁被随机分配、分到哪个版本、是否真正暴露、测量什么结局、以什么单位分析。
    随机分配的目标是在长期上平衡已知和未知混杂因素，但只有实际分配、暴露和记录符合设计时才能支持因果解释。
  - >-
    对 0/1 指标，组内均值就是该组的事件比例。绝对效应用两组比例相减，通常用百分点报告；
    相对提升再除以基线比例。两者可以同时有用，但不能互换标签或隐藏分母。
  - >-
    统计显著说明数据相对某个无效应基准的极端性，不保证实际收益足够大。
    一个完整决策应将点估计和整个置信区间同事先规定的最小实际效应比较，同时说明成本、风险和次级指标。
  - >-
    随机化不是质量豁免权。分配不均、实验组交叉污染、结局缺失、两组差异流失、重复观测当独立观测、
    事后挑选指标或人群、频繁查看后停止等问题，都可破坏原定误差和因果解释。

formula_explanation:
  - name: 绝对差与相对提升
    expression: "绝对差=p_B-p_A；相对提升=(p_B-p_A)/p_A"
    symbols:
      p_A: 基线版本的事件比例
      p_B: 新版本的事件比例
    meaning: 前者描述绝对变化，后者描述相对于基线的比例变化。
    assumptions:
      - 两组结局定义、时间窗口和分析单位一致。
      - 分母包括哪些随机化或暴露单位已被明确说明。
    cautions:
      - 百分点差和相对百分比是两个不同口径。
      - 当基线接近零时，相对提升可能非常大且不稳定，必须同时报告绝对差。
  - name: 多次独立检验的至少一次假阳性风险
    expression: "P(至少一次)=1-(1-α)^m"
    symbols:
      alpha: 每次检验的一类错误率
      m: 相互独立且原假设都为真的检验数量
    meaning: 在简化的独立假设下，先计算每次都不假阳性的补集概率。
    assumptions:
      - 仅用于说明多重比较风险的简化独立情形。
    cautions:
      - 现实指标经常相关，具体错误率与校正方法应由预定分析计划确认。

python_connection:
  - library: pandas
    api: groupby、mean、count、size 和缺失汇总
    purpose: 按分配组计算指标、有效分母、原始分配数和流失率。
    input_expectation: 先检查唯一标识、分配标签、二元值合法性、缺失和重复单位。
    interpretation_caution: 分组均值是描述性汇总；因果解释取决于实际分配与执行，不是 groupby 自动产生。
  - library: SciPy
    api: 独立样本检验和参考分布函数
    purpose: 在指标类型、独立性、方向与方差条件已确认时计算检验结果。
    input_expectation: 两组数组必须对应两组独立单位，不能把配对、重复测量或聚类数据冒充独立样本。
    interpretation_caution: 软件结果不能修复自选分组、差异流失、可选停止或多重比较。

data_interpretation_guidance:
  - 同时报告每组原始分配数、有效数、缺失/流失数、效应量、区间和 p 值。
  - 对二元指标同时标注百分点绝对差和相对提升的分母。
  - 把统计显著性和预先规定的实际重要阈值分开判断，不用一个小 p 值代替业务或教学决策。
  - 如果实验不是随机分配，应明确写成观察性比较，不直接宣称版本造成差异。
  - 两组流失率不同时，需检查流失与结局的关系并做适当敏感性分析，不能简单删行后声称无偏。
  - 外部适用性取决于受试人群、时间、场景和实施方式，随机化不自动保证无限外推。

common_misconceptions:
  - misconception: 统计显著就意味着实际收益很大。
    why_incorrect: 显著性受效应量、变异和样本量共同影响，必须将效应与区间同预设实际阈值比较。
    better_question: 点估计和区间有多少落在实际关心阈值的哪一侧？
  - misconception: 用户自己选版本就是随机分组。
    why_incorrect: 自选行为可能与能力、偏好、设备或其他结局因素共同变化，导致组间原本就不可比。
    better_question: 哪个外生随机机制决定每个单位进入 A 还是 B？
  - misconception: 随机分组后任何数据问题都不会影响结论。
    why_incorrect: 差异缺失、污染、错误记录、可选停止和多指标挑选都会破坏原定分析口径。
    better_question: 随机分配后每个单位是否按预定方式被暴露、跟踪并纳入分析？

reflective_questions:
  - 为什么绝对百分点差和相对提升需要同时披露？
  - 一个完整 A/B 报告为什么不能只有 p 值？
  - 差异流失和多重比较分别会破坏哪一段证据链？

summary:
  - A/B 实验从随机化单位、分配、暴露、结局和分析单位的可审计定义开始。
  - 效应解释必须区分绝对百分点差与相对提升，并联合报告区间、p 值和实际阈值。
  - 随机化支持因果解释但不自动修复流失、污染、可选停止、多重比较或外部适用性问题。
  - 纯合成数据可以支持可重现教学，但不能伪装成真实实验证据。
