[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "probstat-python-tutor"
version = "0.1.0"
description = "A beginner-friendly probability, statistics, and Python data analysis tutor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "openai-agents>=0.2",
    "pandas>=2.2",
    "pydantic>=2.10",
    "PyYAML>=6.0",
    "scipy>=1.14",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest_run_tmp"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".pytest_run_cache"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
